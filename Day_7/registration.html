<!DOCTYPE html>
<html>

<head>
  <title>Login - Ecommerce Website</title>
  <style>
    /* --- Shared Theme Styles (From Home Page) --- */
    body {
      background-color: rgb(255, 255, 255);
      margin: 0;
      padding: 0;
    }

    .navbar {
      padding: 15px 40px;
      background-color: rgb(76, 231, 76);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: Arial, sans-serif;
    }

    nav {
      margin: 15px;
      padding: 10px;
      text-align: center;
    }

    nav a {
      padding: 10px;
      font-family: sans-serif;
      color: black;
      text-decoration: none;
    }

    .navbar ul {
      list-style: none;
      display: flex;
      gap: 20px;
      margin: 0;
      padding: 0;
    }

    .logo {
      font-weight: bold;
      font-size: 20px;
      font-family: Arial, sans-serif;
    }

    .icons button {
      margin-left: 15px;
      color: black;
      background: #0077cc;
      color: #fff;
      border: none;
      padding: 10px 15px;
      border-radius: 5px;
      cursor: pointer;
    }

    .icons button:hover {
      background: #005fa3;
    }

    .tb {
      width: 100%;
      border-collapse: collapse;
      text-align: center;
      font-family: Arial, sans-serif;
    }

    footer {
      background-color: rgb(76, 231, 76);
      padding: 20px;
      font-family: Arial, sans-serif;
      margin-top: 50px;
    }

    /* --- Login Specific Styles --- */
    .login-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 60vh;
      padding: 40px 20px;
    }

    .login-container {
      width: 100%;
      max-width: 400px;
      background-color: rgb(236, 234, 234);
      padding: 40px;
      border-radius: 20px;
      font-family: Arial, sans-serif;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }

    .login-container h2 {
      text-align: center;
      margin-bottom: 25px;
      color: #333;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      font-size: 14px;
      color: #444;
    }

    .form-group input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 14px;
      box-sizing: border-box;
    }

    .form-group input:focus {
      outline: 2px solid rgb(72, 0, 255);
    }

    .login-btn {
      width: 100%;
      padding: 12px;
      background-color: rgb(70, 193, 70);
      color: rgb(255, 255, 255);
      border: none;
      border-radius: 5px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      transition: background-color 0.2s ease;
    }

    .login-btn:hover {
      background-color: rgb(50, 0, 180);
    }

    .form-footer {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
    }

    .form-footer a {
      color: rgb(72, 0, 255);
      text-decoration: none;
    }

    .form-footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <!-- Identical Navbar Header -->
  <header class="navbar">
    <div class="logo">Ecommerce Website</div>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="productpage1.html">All Products</a></li>
        <li><a href="#">New Arrivals</a></li>
        <li><a href="#">Smart Home</a></li>
        <li><a href="#">Audio</a></li>
      </ul>
    </nav>
    <div class="icons">
      <!-- <button onclick="location.href='#'">Login</button> -->
      <!-- <button>Cart</button> -->
    </div>
  </header>

  <!-- Login Form Area Layout Matching Homepage Containers -->
  <div class="login-wrapper">
    <div class="login-container">
      <h2>Create Account</h2>
      <form action="#" method="POST">

        <div class="form-group">
          <label for="fname">First Name</label>
          <input type="text" id="fname" name="fname" required placeholder="Enter your First Name">
        </div>

        <div class="form-group">
          <label for="lname">Last Name</label>
          <input type="text" id="lname" name="lname" required placeholder="Enter your Last Name">
        </div>
        
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" required placeholder="Enter your email">
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required placeholder="Enter your password">
        </div>

        <div class="form-group">
          <label for="cpassword">Confirm Password</label>
          <input type="password" id="cpassword" name="cpassword" required placeholder="Re-enter your password">
        </div>

        <button type="submit" class="login-btn">Register</button>
      </form>
    </div>
  </div>

  <!-- Identical Footer Structure -->
  <footer>
    <table class="tb">
      <tr>
        <th>About</th>
        <th>Group Company</th>
        <th>Help</th>
        <th>Legal & Trust</th>
      </tr>
      <tr>
        <td>Contact Us</td>
        <td>Samsung</td>
        <td>FAQs</td>
        <td>Privacy Policy</td>
      </tr>
      <tr>
        <td>About Us</td>
        <td>Apple</td>
        <td>Shipping & Returns</td>
        <td>Terms of Service</td>
      </tr>
      <tr>
        <td></td>
        <td>One plus</td>
        <td>Order Tracking</td>
      </tr>
      <tr>
        <td></td>
        <td>Redmi</td>
        <td>Payment Options</td>
      </tr>
    </table>
  </footer>
</body>

</html>
